<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Kepegawaian - DUK Generator</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- SheetJS for Excel processing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }
        .upload-area:hover, .upload-area.dragover {
            background: rgba(0, 229, 255, 0.05);
            border-color: var(--accent);
        }
        .glass-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            padding: 1rem;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 1.5rem;
        }
        .glass-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .progress-container {
            display: none;
            margin-top: 2rem;
        }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .log-container {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .log-entry { margin-bottom: 0.3rem; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div id="sidebar-container"></div>

        <main class="main-panel glass-panel">
        <header class="top-bar">
            <div class="header-left">
                <button id="mobile-menu-btn" class="mobile-menu-btn">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="page-title">
                    <h1>DUK Generator</h1>
                    <p class="subtitle">Automasi Pembuatan Daftar Urut Kepangkatan via API SIMPEG</p>
                </div>
            </div>
        </header>

        <section class="content-area">
            <div class="glass-panel" style="padding: 2.5rem; border-radius: 16px;">
                <h3 style="margin-bottom: 1.5rem;">Konfigurasi API SIMPEG</h3>
                
                <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Cookie Sesi (Ambil dari Network Tab Browser saat login SIMPEG)</label>
                <textarea id="cookie-input" class="glass-textarea" placeholder="_ga_XTKXHMEFK4=...; kemenag_session=...; XSRF-TOKEN=..."></textarea>
                
                <h3 style="margin-bottom: 1rem; margin-top: 2rem;">Upload File NIP</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
                    Format: NIP berada di <strong>Kolom B mulai baris ke-6</strong> (Cell B6, B7, dst).
                </p>
                
                <div class="upload-area" id="drop-zone" onclick="document.getElementById('excel-file').click()">
                    <span class="material-symbols-outlined" style="font-size: 48px; color: var(--accent); margin-bottom: 1rem;">upload_file</span>
                    <h3 id="upload-text">Pilih atau Tarik File Excel ke sini</h3>
                    <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">.xlsx, .xls</p>
                    <input type="file" id="excel-file" accept=".xlsx, .xls" style="display: none;">
                </div>

                <div style="display: flex; gap: 1rem; align-items: center; margin-top: 2rem; flex-wrap: wrap;">
                    <button id="btn-process" class="btn-primary glass-btn" style="flex: 1; padding: 1rem; min-width: 200px;" disabled>
                        <span class="material-symbols-outlined">sync</span> Mulai Proses DUK
                    </button>
                    <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                        <span class="material-symbols-outlined" style="font-size: 1.2rem;">speed</span>
                        <label for="worker-count" style="white-space: nowrap; font-size: 0.9rem;">Workers:</label>
                        <input type="number" id="worker-count" value="5" min="1" max="15" 
                            style="width: 60px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; padding: 0.5rem; text-align: center;">
                    </div>
                    <button id="btn-download" class="btn-primary glass-btn" style="flex: 1; padding: 1rem; min-width: 200px; display: none; background: linear-gradient(135deg, #059669, #10b981);">
                        <span class="material-symbols-outlined">download</span> Unduh Excel DUK
                    </button>
                </div>
                
                <div class="progress-container" id="progress-container">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span id="progress-text">Memproses 0 dari 0 NIP...</span>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <span id="progress-speed" style="color: var(--accent); font-size: 0.85rem;"></span>
                            <span id="progress-percentage" style="font-weight: 700;">0%</span>
                        </div>
                    </div>
                    <div class="progress-bar" style="margin: 0.5rem 0;">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="log-container" id="log-container"></div>
                </div>
            </div>
        </section>
    </main>
    </div> <!-- End Dashboard Container -->

    <!-- Sidebar Script -->
    <script src="sidebar.js"></script>

    <script>
        let inputNIPs = [];
        let outputData = [];
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('excel-file');
        const uploadText = document.getElementById('upload-text');
        const btnProcess = document.getElementById('btn-process');
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });
        
        function handleFile(file) {
            uploadText.innerHTML = `File terpilih:<br><span style="color:white; font-size: 1.1rem;">${file.name}</span>`;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                inputNIPs = [];
                for (let R = 5; R <= range.e.r; ++R) {
                    const cell = worksheet[XLSX.utils.encode_cell({c: 1, r: R})];
                    if (cell && cell.v) {
                        let nip = cell.v.toString().trim().replace(/[^0-9]/g, '');
                        if (nip.length >= 18) inputNIPs.push(nip);
                    }
                }
                logMessage(`Berhasil memuat file. Ditemukan ${inputNIPs.length} NIP valid.`, 'success');
                if (inputNIPs.length > 0) btnProcess.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }
        
        function getJenisJabatan(jabatanLengkap) {
            let text = (jabatanLengkap || '').replace(/\s+/g, ' ').trim();
            const parenMatch = text.match(/^(.*?)\((.*?)\)$/);
            let jabatanUtama = parenMatch ? parenMatch[1].trim() : text;
            if (!parenMatch) {
                const delimiterMatch = text.match(/(.*?)(?:\spada\s|\sdi\s)(.+)/i);
                if (delimiterMatch) jabatanUtama = delimiterMatch[1].trim();
            }
            let j = jabatanUtama.toLowerCase();
            if (/kepala|kasubbag|kasi|penyelenggara|kaur/.test(j)) return "Struktural";
            if (/guru|pengawas|penyuluh|penghulu|ahli|terampil|mahir|penyelia|pranata|analis|auditor|pengembang|widyaiswara|pustakawan|arsiparis/.test(j)) return "Fungsional";
            return "Pelaksana";
        }
        
        const logContainer = document.getElementById('log-container');
        let doneCount = 0;
        let totalCount = 0;
        let startTime = 0;

        function logMessage(msg, type = '') {
            document.getElementById('progress-container').style.display = 'block';
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
            while (logContainer.children.length > 300) logContainer.removeChild(logContainer.firstChild);
        }

        function updateProgress() {
            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
            document.getElementById('progress-fill').style.width = `${pct}%`;
            document.getElementById('progress-percentage').textContent = `${pct}%`;
            document.getElementById('progress-text').textContent = `Selesai ${doneCount} dari ${totalCount} NIP`;

            const elapsed = (Date.now() - startTime) / 1000;
            if (elapsed > 0 && doneCount > 0) {
                const speed = (doneCount / elapsed).toFixed(1);
                const remaining = totalCount - doneCount;
                const eta = remaining > 0 ? Math.ceil(remaining / (doneCount / elapsed)) : 0;
                document.getElementById('progress-speed').textContent =
                    `${speed} NIP/s · ETA ${eta}s`;
            }
        }
        
        async function fetchSIMPEG(url, cookie) {
            const res = await fetch('/api/simpeg', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, cookie })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || `HTTP ${res.status}`);
            }
            return await res.json();
        }

        function createPool(concurrency) {
            let active = 0;
            const queue = [];
            return function schedule(task) {
                return new Promise((resolve, reject) => {
                    const run = async () => {
                        active++;
                        try { resolve(await task()); }
                        catch (e) { reject(e); }
                        finally {
                            active--;
                            if (queue.length > 0) queue.shift()();
                        }
                    };
                    if (active < concurrency) run();
                    else queue.push(run);
                });
            };
        }

        async function processNIP(nip, cookie, index) {
            try {
                const pDataRes = await fetchSIMPEG(
                    `https://simpeg5.kemenag.go.id/get_data_pegawai?NIP_BARU=${nip}`, cookie
                );
                if (!pDataRes || pDataRes.length === 0) {
                    logMessage(`⚠️ [${index}] NIP ${nip} tidak ditemukan.`, 'error');
                    return null;
                }
                const peg = pDataRes[0];

                const pktRes = await fetchSIMPEG(
                    `https://simpeg5.kemenag.go.id/get_pangkat?NIP_LAMA=${peg.NIP}`, cookie
                );

                let mkTahun = 0, mkBulan = 0;
                let kpGol = peg.GOL_RUANG, kpTmt = peg.TMT_SK_GOL || "";
                if (pktRes && pktRes.length > 0) {
                    const skCpns = pktRes.find(p => p.REF_DESC1 === "SK CPNS");
                    if (skCpns) { mkTahun = skCpns.MK_TAHUN || 0; mkBulan = skCpns.MK_BULAN || 0; }
                    pktRes.sort((a, b) => b.NO_URUT - a.NO_URUT);
                    kpGol = pktRes[0].GOL_RUANG;
                    kpTmt = pktRes[0].TMT_SK;
                }

                const jenis = (nip.substring(12, 15) === "211" || nip.substring(12, 15) === "212") ? "PPPK" : "PNS";
                logMessage(`✅ [${index}] ${peg.NAMA_LENGKAP}`, 'success');

                return {
                    _idx: index,
                    "NIP BARU":      peg.NIP_BARU_VIEW || nip,
                    "NIP LAMA":      peg.NIP_VIEW || "",
                    "NAMA":          peg.NAMA_LENGKAP || "",
                    "STATUS":        jenis,
                    "TMT CPNS":      peg.MASUK_PEGAWAI || "",
                    "GOLONGAN":      peg.GOL_RUANG || "",
                    "MK TAHUN":      mkTahun,
                    "MK BULAN":      mkBulan,
                    "TMT PNS":       peg.tmt_pns || "",
                    "KP - GOL":      kpGol,
                    "KP - TMT":      kpTmt,
                    "TEMPAT TUGAS":  peg.UNIT_KERJA || "",
                    "JABATAN":       getJenisJabatan(peg.KET_JABATAN || ""),
                    "PENSIUN":       peg.TMT_PENSIUN || ""
                };
            } catch (e) {
                logMessage(`❌ [${index}] NIP ${nip}: ${e.message}`, 'error');
                return null;
            } finally {
                doneCount++;
                updateProgress();
            }
        }

        btnProcess.addEventListener('click', async () => {
            const cookie = document.getElementById('cookie-input').value.trim();
            if (!cookie) { alert("Harap masukkan Cookie SIMPEG!"); return; }

            const CONCURRENCY = Math.max(1, Math.min(15, parseInt(document.getElementById('worker-count').value) || 5));

            btnProcess.disabled = true;
            btnProcess.innerHTML = `<span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">sync</span> ${CONCURRENCY} Workers Aktif...`;
            outputData = [];
            doneCount = 0;
            totalCount = inputNIPs.length;
            startTime = Date.now();
            logContainer.innerHTML = '';

            updateProgress();
            logMessage(`🚀 Memulai ${totalCount} NIP dengan ${CONCURRENCY} workers paralel...`);

            const runInPool = createPool(CONCURRENCY);

            const results = await Promise.all(
                inputNIPs.map((nip, i) => runInPool(() => processNIP(nip, cookie, i + 1)))
            );

            outputData = results
                .filter(r => r !== null)
                .sort((a, b) => a._idx - b._idx)
                .map((row, idx) => {
                    const { _idx, ...rest } = row;
                    return { "NO": idx + 1, ...rest };
                });

            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('progress-percentage').textContent = '100%';
            document.getElementById('progress-text').textContent = `Selesai ${totalCount} NIP dalam ${elapsed} detik`;
            document.getElementById('progress-speed').textContent = '';
            logMessage(`🎉 Proses selesai! ${outputData.length} sukses, ${totalCount - outputData.length} gagal. Total waktu: ${elapsed}s`, 'success');

            btnProcess.style.display = 'none';
            document.getElementById('btn-download').style.display = 'flex';
        });

        document.getElementById('btn-download').addEventListener('click', () => {
            if (outputData.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(outputData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DUK");
            XLSX.writeFile(wb, "Daftar_Urut_Kepangkatan_SIMPEG.xlsx");
        });
        
    </script>
</body>
</html>
