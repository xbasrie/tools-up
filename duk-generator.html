<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Kepegawaian - DUK Generator</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- SheetJS for Excel processing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }
        .upload-area:hover, .upload-area.dragover {
            background: rgba(0, 229, 255, 0.05);
            border-color: var(--accent);
        }
        .glass-textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            padding: 1rem;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 1.5rem;
        }
        .glass-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }
        .progress-container {
            display: none;
            margin-top: 2rem;
        }
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .log-container {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #a0aec0;
        }
        .log-entry { margin-bottom: 0.3rem; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div id="sidebar-container"></div>

        <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button id="mobile-menu-btn" class="mobile-menu-btn">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="title-section">
                    <h1>DUK Generator</h1>
                    <p>Automasi Pembuatan Daftar Urut Kepangkatan via API SIMPEG</p>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="glass-panel" style="padding: 2.5rem; border-radius: 16px;">
                <h3 style="margin-bottom: 1.5rem;">Konfigurasi API SIMPEG</h3>
                
                <label style="display:block; margin-bottom: 0.5rem; color: var(--text-secondary);">Cookie Sesi (Ambil dari Network Tab Browser saat login SIMPEG)</label>
                <textarea id="cookie-input" class="glass-textarea" placeholder="_ga_XTKXHMEFK4=...; kemenag_session=...; XSRF-TOKEN=..."></textarea>
                
                <h3 style="margin-bottom: 1rem; margin-top: 2rem;">Upload File NIP</h3>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
                    Format: NIP berada di <strong>Kolom B mulai baris ke-6</strong> (Cell B6, B7, dst).
                </p>
                
                <div class="upload-area" id="drop-zone" onclick="document.getElementById('excel-file').click()">
                    <span class="material-symbols-outlined" style="font-size: 48px; color: var(--accent); margin-bottom: 1rem;">upload_file</span>
                    <h3 id="upload-text">Pilih atau Tarik File Excel ke sini</h3>
                    <p style="color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.9rem;">.xlsx, .xls</p>
                    <input type="file" id="excel-file" accept=".xlsx, .xls" style="display: none;">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button id="btn-process" class="btn-primary glass-btn" style="flex: 1; padding: 1rem;" disabled>
                        <span class="material-symbols-outlined">sync</span> Mulai Proses DUK
                    </button>
                    <button id="btn-download" class="btn-primary glass-btn" style="flex: 1; padding: 1rem; display: none; background: #10b981;">
                        <span class="material-symbols-outlined">download</span> Unduh Excel DUK
                    </button>
                </div>
                
                <div class="progress-container" id="progress-container">
                    <div style="display: flex; justify-content: space-between;">
                        <span id="progress-text">Memproses 0 dari 0 NIP...</span>
                        <span id="progress-percentage">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="log-container" id="log-container"></div>
                </div>
            </div>
        </div>
    </main>
    </div> <!-- End Dashboard Container -->

    <!-- Sidebar Script -->
    <script src="sidebar.js"></script>

    <script>
        let inputNIPs = [];
        let outputData = [];
        
        // Setup Drag & Drop
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('excel-file');
        const uploadText = document.getElementById('upload-text');
        const btnProcess = document.getElementById('btn-process');
        
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });
        
        function handleFile(file) {
            uploadText.innerHTML = `File terpilih:<br><span style="color:white; font-size: 1.1rem;">${file.name}</span>`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Get range
                const range = XLSX.utils.decode_range(worksheet['!ref']);
                inputNIPs = [];
                
                // Start from B6 (Row index 5, Col index 1)
                for (let R = 5; R <= range.e.r; ++R) {
                    const cellRef = XLSX.utils.encode_cell({c: 1, r: R}); // Column B is 1
                    const cell = worksheet[cellRef];
                    if (cell && cell.v) {
                        let nip = cell.v.toString().trim().replace(/[^0-9]/g, '');
                        if (nip.length >= 18) {
                            inputNIPs.push(nip);
                        }
                    }
                }
                
                logMessage(`Berhasil memuat file. Ditemukan ${inputNIPs.length} NIP valid.`, 'success');
                if (inputNIPs.length > 0) btnProcess.disabled = false;
            };
            reader.readAsArrayBuffer(file);
        }
        
        // --- Klasifikasi Jabatan Logic (Copied from Peta Jabatan) ---
        function getJenisJabatan(jabatanLengkap) {
            let text = jabatanLengkap.replace(/\s+/g, ' ').trim();
            const parenMatch = text.match(/^(.*?)\((.*?)\)$/);
            let jabatanUtama = text;
            
            if (parenMatch) {
                jabatanUtama = parenMatch[1].trim();
            } else {
                const delimiterMatch = text.match(/(.*?)(?:\spada\s|\sdi\s)(.+)/i);
                if (delimiterMatch) jabatanUtama = delimiterMatch[1].trim();
                else {
                    const satkerKeywords = /\b(Kelompok Jabatan Fungsional.*|Kantor Kementerian Agama.*|MAN\s*\d*.*|MIN\s*\d+.*|MTsN\s*\d+.*|KUA\s+.*|Seksi\s+.*|Sub Bagian\s+.*|Urusan Tata Usaha.*|Penyelenggara\s+.*)/i;
                    const kwMatch = text.match(satkerKeywords);
                    if (kwMatch) jabatanUtama = text.replace(kwMatch[0], "").trim();
                }
            }
            
            let j = jabatanUtama.toLowerCase();
            if (/kepala|kasubbag|kasi|penyelenggara|kaur/.test(j)) return "Struktural";
            if (/guru|pengawas|penyuluh|penghulu|ahli|terampil|mahir|penyelia|pranata|analis|auditor|pengembang|widyaiswara|pustakawan|arsiparis/.test(j)) return "Fungsional";
            return "Pelaksana";
        }
        
        // --- API & Processing ---
        const logContainer = document.getElementById('log-container');
        function logMessage(msg, type = '') {
            document.getElementById('progress-container').style.display = 'block';
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            div.textContent = `[${time}] ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        async function fetchSIMPEG(url, cookie) {
            try {
                const res = await fetch('/api/simpeg', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, cookie })
                });
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                return await res.json();
            } catch (error) {
                console.error("Fetch error:", error);
                return null;
            }
        }
        
        btnProcess.addEventListener('click', async () => {
            const cookie = document.getElementById('cookie-input').value.trim();
            if (!cookie) {
                alert("Harap masukkan Cookie SIMPEG!");
                return;
            }
            
            btnProcess.disabled = true;
            btnProcess.innerHTML = '<span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">sync</span> Memproses...';
            outputData = [];
            
            for (let i = 0; i < inputNIPs.length; i++) {
                const nip = inputNIPs[i];
                logMessage(`Memproses NIP: ${nip} (${i+1}/${inputNIPs.length})...`);
                
                // Update Progress
                const pct = Math.round(((i) / inputNIPs.length) * 100);
                document.getElementById('progress-fill').style.width = `${pct}%`;
                document.getElementById('progress-percentage').textContent = `${pct}%`;
                document.getElementById('progress-text').textContent = `Memproses NIP ${i+1} dari ${inputNIPs.length}`;
                
                try {
                    // 1. Get Data Pegawai
                    const pDataRes = await fetchSIMPEG(`https://simpeg5.kemenag.go.id/get_data_pegawai?NIP_BARU=${nip}`, cookie);
                    if (!pDataRes || pDataRes.length === 0) {
                        logMessage(`⚠️ NIP ${nip} tidak ditemukan di SIMPEG.`, 'error');
                        continue;
                    }
                    const peg = pDataRes[0];
                    const nipLamaEnc = peg.NIP;
                    
                    // 2. Get Pangkat History
                    const pktRes = await fetchSIMPEG(`https://simpeg5.kemenag.go.id/get_pangkat?NIP_LAMA=${nipLamaEnc}`, cookie);
                    let mkTahun = 0, mkBulan = 0;
                    let kpGol = peg.GOL_RUANG, kpTmt = peg.TMT_SK_GOL || ""; // Fallback
                    
                    if (pktRes && pktRes.length > 0) {
                        // MK CPNS
                        const skCpns = pktRes.find(p => p.REF_DESC1 === "SK CPNS");
                        if (skCpns) {
                            mkTahun = skCpns.MK_TAHUN || 0;
                            mkBulan = skCpns.MK_BULAN || 0;
                        }
                        
                        // KP Terakhir (Highest NO_URUT)
                        pktRes.sort((a,b) => b.NO_URUT - a.NO_URUT);
                        kpGol = pktRes[0].GOL_RUANG;
                        kpTmt = pktRes[0].TMT_SK;
                    }
                    
                    // Status PNS/PPPK
                    const jenis = (nip.substring(12, 15) === "211" || nip.substring(12, 15) === "212") ? "PPPK" : "PNS";
                    
                    // Jabatan Class
                    const jabatanText = peg.KET_JABATAN || "";
                    const jabatanClass = getJenisJabatan(jabatanText);
                    
                    // Compile Row
                    outputData.push({
                        "NO": outputData.length + 1,
                        "NIP BARU": peg.NIP_BARU_VIEW || nip,
                        "NIP LAMA": peg.NIP_VIEW || "",
                        "NAMA": peg.NAMA_LENGKAP || "",
                        "STATUS": jenis,
                        "TMT CPNS": peg.MASUK_PEGAWAI || "",
                        "GOLONGAN": peg.GOL_RUANG || "",
                        "MK TAHUN": mkTahun,
                        "MK BULAN": mkBulan,
                        "TMT PNS": peg.tmt_pns || "",
                        "KP - GOL": kpGol,
                        "KP - TMT": kpTmt,
                        "TEMPAT TUGAS": peg.UNIT_KERJA || "",
                        "JABATAN": jabatanClass,
                        "PENSIUN": peg.TMT_PENSIUN || ""
                    });
                    
                    logMessage(`✅ Sukses: ${peg.NAMA_LENGKAP}`, 'success');
                } catch (e) {
                    logMessage(`❌ Gagal memproses NIP ${nip}: ${e.message}`, 'error');
                }
            }
            
            // Finish
            document.getElementById('progress-fill').style.width = `100%`;
            document.getElementById('progress-percentage').textContent = `100%`;
            document.getElementById('progress-text').textContent = `Selesai memproses ${inputNIPs.length} NIP.`;
            logMessage(`🎉 Proses Selesai! Klik Unduh Excel untuk menyimpan.`, 'success');
            
            btnProcess.style.display = 'none';
            document.getElementById('btn-download').style.display = 'flex';
        });
        
        document.getElementById('btn-download').addEventListener('click', () => {
            if (outputData.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(outputData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DUK");
            XLSX.writeFile(wb, "Daftar_Urut_Kepangkatan_SIMPEG.xlsx");
        });
        
    </script>
</body>
</html>
